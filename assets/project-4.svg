<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 700" width="1440" height="700" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <radialGradient id="spot" cx="50%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#26211c"/><stop offset="70%" stop-color="#141110"/><stop offset="100%" stop-color="#0b0908"/>
    </radialGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#efe9dd"/><stop offset="100%" stop-color="#ddd5c6"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e3c07a"/><stop offset="50%" stop-color="#c39a4e"/><stop offset="100%" stop-color="#9d7734"/>
    </linearGradient>
    <radialGradient id="soft"><stop offset="0%" stop-color="#000" stop-opacity=".45"/><stop offset="100%" stop-color="#000" stop-opacity="0"/></radialGradient>
  </defs>

  <rect width="1440" height="700" fill="url(#spot)"/>
  <path d="M480 40 V660 M960 40 V660" stroke="#3a322a" stroke-width="1"/>

  <!-- gift box -->
  <ellipse cx="240" cy="470" rx="150" ry="26" fill="url(#soft)"/>
  <rect x="120" y="250" width="240" height="200" rx="6" fill="url(#paper)"/>
  <rect x="120" y="250" width="240" height="52" rx="6" fill="#f3eee3"/>
  <rect x="222" y="250" width="34" height="200" fill="url(#gold)"/>
  <text x="150" y="284" font-size="19" letter-spacing="5" fill="#8a6b32">AURELIA</text>
  <g transform="translate(300 372)">
    <text x="0" y="12" font-size="46" text-anchor="middle" fill="url(#gold)">A</text>
    <path d="M-9 -14 q9 -9 9 0 q-9 9 -9 0 M9 -14 q-9 -9 -9 0 q9 9 9 0" fill="url(#gold)" opacity=".9"/>
  </g>
  <text x="240" y="520" font-size="15" letter-spacing="3.5" text-anchor="middle" fill="#a98a4e">GIFT BOX — RIGID BOARD, FOIL BAND</text>

  <!-- shopping bag -->
  <ellipse cx="720" cy="500" rx="150" ry="26" fill="url(#soft)"/>
  <path d="M660 210 q60 -60 120 0" fill="none" stroke="url(#gold)" stroke-width="9" stroke-linecap="round"/>
  <rect x="612" y="215" width="216" height="270" rx="5" fill="url(#paper)"/>
  <g transform="translate(720 320)">
    <text x="0" y="18" font-size="62" text-anchor="middle" fill="url(#gold)">A</text>
    <path d="M-12 -20 q12 -12 12 0 q-12 12 -12 0 M12 -20 q-12 -12 -12 0 q12 12 12 0" fill="url(#gold)" opacity=".9"/>
  </g>
  <text x="720" y="400" font-size="24" letter-spacing="7" text-anchor="middle" fill="#8a6b32">AURELIA</text>
  <text x="720" y="545" font-size="15" letter-spacing="3.5" text-anchor="middle" fill="#a98a4e">SHOPPING BAG — GOLD ROPE HANDLE</text>

  <!-- mug -->
  <ellipse cx="1190" cy="470" rx="140" ry="24" fill="url(#soft)"/>
  <path d="M1300 300 q62 40 0 92" fill="none" stroke="#e6dfd2" stroke-width="22" stroke-linecap="round"/>
  <rect x="1080" y="270" width="220" height="190" rx="26" fill="url(#paper)"/>
  <g transform="translate(1190 372)">
    <text x="0" y="18" font-size="60" text-anchor="middle" fill="url(#gold)">A</text>
    <path d="M-12 -20 q12 -12 12 0 q-12 12 -12 0 M12 -20 q-12 -12 -12 0 q12 12 12 0" fill="url(#gold)" opacity=".9"/>
  </g>
  <text x="1190" y="520" font-size="15" letter-spacing="3.5" text-anchor="middle" fill="#a98a4e">THE MUG — MATTE-GLAZE STONEWARE</text>
</svg>
