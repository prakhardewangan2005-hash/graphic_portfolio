<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <radialGradient id="pbg" cx="62%" cy="30%" r="85%">
      <stop offset="0%"  stop-color="#1b1140"/>
      <stop offset="52%" stop-color="#0d0824"/>
      <stop offset="100%" stop-color="#050310"/>
    </radialGradient>
    <linearGradient id="grad-you" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#8b5cf6"/>
      <stop offset="55%"  stop-color="#7c6cf5"/>
      <stop offset="100%" stop-color="#4f9bf5"/>
    </linearGradient>
    <linearGradient id="cardP" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#7c4ef0"/>
      <stop offset="100%" stop-color="#5326c9"/>
    </linearGradient>
    <linearGradient id="cardP2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#5b34c4"/>
      <stop offset="100%" stop-color="#3a1f8c"/>
    </linearGradient>
    <linearGradient id="bioC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#6b3fe0" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#3b1f96" stop-opacity=".75"/>
    </linearGradient>
    <linearGradient id="torus" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4a2a9e"/>
      <stop offset="100%" stop-color="#241056"/>
    </linearGradient>
    <filter id="pglow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="520" fill="url(#pbg)"/>
  <ellipse cx="880" cy="180" rx="300" ry="180" fill="#7c4ef0" opacity=".18" filter="url(#pglow)"/>
  <ellipse cx="180" cy="430" rx="180" ry="120" fill="#8b5cf6" opacity=".14" filter="url(#pglow)"/>

  <!-- ── left column ── -->
  <g>
    <rect x="40" y="34" width="240" height="40" rx="20" fill="#1a1040" fill-opacity=".7" stroke="#8b5cf6" stroke-opacity=".55"/>
    <text x="62" y="59" font-size="14" letter-spacing="1.6" font-weight="600" fill="#c9b6ff">UX/UI CASE STUDY</text>
    <path d="M256 46l4 8 8 4-8 4-4 8-4-8-8-4 8-4z" fill="#a78bfa"/>

    <text x="40" y="152" font-size="58" font-weight="700" letter-spacing="-2.2" fill="#ffffff">Deep Work,</text>
    <text x="40" y="216" font-size="58" font-weight="700" letter-spacing="-2.2" fill="url(#grad-you)">Better You.</text>

    <text x="40" y="258" font-size="17.5" fill="#b9b6d4">A cognitive focus system that adapts</text>
    <text x="40" y="284" font-size="17.5" fill="#b9b6d4">to <tspan fill="#a78bfa">your</tspan> rhythm, not the other way around.</text>

    <g font-size="13.5" fill="#d6d3ea">
      <rect x="40" y="322" width="17" height="17" rx="5" fill="none" stroke="#8b5cf6" stroke-width="1.4"/>
      <circle cx="48.5" cy="330.5" r="2.6" fill="#8b5cf6"/>
      <text x="66" y="335">Focus Science</text>
      <rect x="176" y="320" width="1" height="22" fill="#3a3560"/>
      <circle cx="196" cy="326" r="2.4" fill="#8b5cf6"/><circle cx="204" cy="334" r="2.4" fill="#8b5cf6"/><circle cx="192" cy="336" r="2.4" fill="#8b5cf6"/>
      <text x="216" y="335">Adaptive Intelligence</text>
      <rect x="368" y="320" width="1" height="22" fill="#3a3560"/>
      <path d="M388 322l9 3v6c0 4-4 7-9 9-5-2-9-5-9-9v-6z" fill="none" stroke="#8b5cf6" stroke-width="1.4"/>
      <text x="406" y="335">Privacy First</text>
    </g>

    <!-- 3D torus on podium -->
    <ellipse cx="150" cy="470" rx="118" ry="30" fill="#1b1140" opacity=".9"/>
    <ellipse cx="150" cy="466" rx="118" ry="30" fill="none" stroke="#8b5cf6" stroke-opacity=".45"/>
    <g transform="translate(150 424) rotate(-16)">
      <ellipse rx="76" ry="52" fill="url(#torus)"/>
      <ellipse rx="46" ry="30" fill="#160a3a"/>
      <ellipse rx="26" ry="16" fill="#a855f7" opacity=".9"/>
      <ellipse rx="76" ry="52" fill="none" stroke="#a78bfa" stroke-opacity=".35"/>
    </g>
  </g>

  <!-- ── right column ── -->
  <!-- flow state / focus mode cards -->
  <rect x="700" y="24" width="300" height="118" rx="18" fill="url(#cardP2)"/>
  <text x="722" y="52" font-size="11" letter-spacing="1.4" fill="#c6b8ff">FLOW STATE</text>
  <path d="M722 74l10 0 6-14 8 26 7-18 6 6h14" fill="none" stroke="#7dd3fc" stroke-width="2"/>

  <rect x="820" y="40" width="340" height="130" rx="18" fill="url(#cardP)"/>
  <text x="846" y="70" font-size="11.5" letter-spacing="1.4" font-weight="600" fill="#e6dcff">FOCUS MODE</text>
  <circle cx="1130" cy="66" r="13" fill="#ffffff" fill-opacity=".18"/>
  <path d="M1130 59l-5 8h5l-1 6 5-8h-5z" fill="#ffffff"/>
  <text x="846" y="122" font-size="34" font-weight="700" letter-spacing="-1.2" fill="#ffffff">Deep Work</text>
  <rect x="846" y="138" width="140" height="4" rx="2" fill="#ffffff" fill-opacity=".92"/>

  <!-- stats strip -->
  <rect x="610" y="188" width="550" height="86" rx="16" fill="#0d0a22" fill-opacity=".92" stroke="#2a2350"/>
  <g font-size="9.5" letter-spacing="1.1" fill="#8e89b0">
    <text x="634" y="212">TOTAL SESSIONS</text>
    <text x="770" y="212">PRODUCTIVITY</text>
    <text x="902" y="212">LONGEST STREAK</text>
    <text x="1036" y="212">DEEP WORK RATIO</text>
  </g>
  <g font-size="27" font-weight="700" letter-spacing="-1" fill="#ffffff">
    <text x="634" y="245">14.</text>
    <text x="770" y="245" fill="#5aa2f8">+41%</text>
    <text x="902" y="245">3-6</text>
    <text x="1036" y="245">0.9%</text>
  </g>
  <g font-size="10.5" fill="#8e89b0">
    <text x="634" y="263">Hours this week</text>
    <text x="770" y="263">Increase</text>
    <text x="902" y="263">Hours per day</text>
    <text x="1036" y="263">Of your day</text>
  </g>
  <g stroke="#2a2350"><path d="M754 204v52M886 204v52M1020 204v52"/></g>

  <!-- biological rhythm sync -->
  <rect x="610" y="288" width="292" height="184" rx="16" fill="url(#bioC)" stroke="#8b5cf6" stroke-opacity=".4"/>
  <text x="632" y="316" font-size="15" font-weight="600" fill="#ffffff">Biological Rhythm Sync</text>
  <text x="632" y="336" font-size="10.5" fill="#cdc6f0">Personalized deep work sessions with your natural</text>
  <text x="632" y="350" font-size="10.5" fill="#cdc6f0">peaks. We work in harmony with science.</text>
  <rect x="632" y="364" width="248" height="92" rx="10" fill="#0d0a22" fill-opacity=".55"/>
  <g>
    <rect x="648" y="428" width="30" height="24" rx="4" fill="#3d5a90"/>
    <rect x="686" y="410" width="30" height="42" rx="4" fill="#4f74b4"/>
    <rect x="724" y="392" width="30" height="60" rx="4" fill="#7fb4ee"/>
    <rect x="762" y="376" width="30" height="76" rx="4" fill="#a9d6ff"/>
    <rect x="800" y="404" width="30" height="48" rx="4" fill="#4a6ba8"/>
    <rect x="838" y="424" width="30" height="28" rx="4" fill="#35507f"/>
  </g>

  <!-- total silence -->
  <rect x="916" y="288" width="244" height="86" rx="16" fill="#100c26" fill-opacity=".95" stroke="#2a2350"/>
  <rect x="936" y="302" width="24" height="24" rx="7" fill="#241a52"/>
  <path d="M942 320l12-12M944 308h9v9" stroke="#c9b6ff" stroke-width="1.5" fill="none"/>
  <text x="936" y="346" font-size="14" font-weight="600" fill="#ffffff">Total Silence</text>
  <text x="936" y="363" font-size="10" fill="#9c96bd">Blocks notifications &amp; apps to keep you in the zone.</text>

  <!-- local processing -->
  <rect x="916" y="386" width="244" height="86" rx="16" fill="#100c26" fill-opacity=".95" stroke="#2a2350"/>
  <rect x="936" y="400" width="24" height="24" rx="7" fill="#241a52"/>
  <circle cx="948" cy="412" r="6" fill="none" stroke="#c9b6ff" stroke-width="1.5"/>
  <circle cx="948" cy="412" r="2" fill="#c9b6ff"/>
  <text x="936" y="444" font-size="14" font-weight="600" fill="#ffffff">Local Processing</text>
  <text x="936" y="461" font-size="10" fill="#9c96bd">Your data stays where you are. No cloud. Just focus.</text>

  <!-- seamless integration -->
  <rect x="610" y="484" width="550" height="30" rx="12" fill="#2a1a6e" fill-opacity=".9" stroke="#5b34c4" stroke-opacity=".6"/>
  <text x="634" y="504" font-size="13.5" font-weight="600" fill="#ffffff">Seamless Integration</text>
  <text x="790" y="504" font-size="10.5" fill="#c4bce8">Calendar, Work Tools, Tasks, AI Co-pilot — unified.</text>
  <rect x="1092" y="490" width="20" height="18" rx="5" fill="#1b1140" stroke="#6b4fd0"/>
  <rect x="1122" y="490" width="20" height="18" rx="5" fill="#1b1140" stroke="#6b4fd0"/>
</svg>
